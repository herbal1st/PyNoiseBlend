# ============================================================================
# NOISE PROFILE CONFIGURATION LEGEND
# ============================================================================
#
# noise_type:         Base mathematical algorithm ("SIMPLEX", "PERLIN", "VALUE").
# seed:               Master integer randomization seed for permutation/hash.
# scale:              Feature wavelength in world units/pixels (larger = wider).
# octaves:            Number of fractal detail accumulation passes [1 - 8].
# decay:              Persistence multiplier scaling amplitude per octave [0-1].
# lacunarity:         Frequency multiplier advancing wavelength per octave.
# sub_sample_factor:  Coarse sampling divider [1 = native, 2 = 2x, 4 = 4x etc].
# ============================================================================